# baseline-template.yaml — template showing what a baseline snapshot captures.
# A real baseline is generated by `mb audit baseline` and saved to
# /etc/mb-backup/baseline.yaml (aligned with vps-bootstrap).

hostname: example
date: 2026-01-01

ssh:
  port: 2222
  permit_root_login: "no"
  password_authentication: "no"
  allow_users: "deploy"
  max_auth_tries: 3
  login_grace_time: 30

firewall:
  default_incoming: "deny"
  default_outgoing: "allow"
  allowed_ports: ["22", "80", "443"]

kernel:
  tcp_congestion_control: "bbr"
  file_max: 1048576
  somaxconn: 4096
  ip_forward: 0
  syncookies: 1

docker:
  exposed_daemon: false
  log_rotation: true
  user_namespace: false

# File integrity fingerprints (mtime + sha256) of sensitive files.
files:
  /etc/passwd:
    mtime: "2026-01-01 00:00:00"
    sha256: "placeholder"
  /etc/shadow:
    mtime: "2026-01-01 00:00:00"
    sha256: "placeholder"
  /etc/sudoers:
    mtime: "2026-01-01 00:00:00"
    sha256: "placeholder"
  /etc/ssh/sshd_config:
    mtime: "2026-01-01 00:00:00"
    sha256: "placeholder"
